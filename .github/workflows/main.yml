name: CI
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
        env:
          NUXT_SESSION_SECRET: ci-session-secret-must-be-32-chars-min
          DATABASE_URL: mysql://root:pwd@localhost:3306/ctrlPublicSite
